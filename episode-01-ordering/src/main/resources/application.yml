spring:
  application:
    name: kafka-ordering-demo
  kafka:
    # Overridden to kafka:9092 inside Docker; localhost is for running the app
    # directly against the compose-provided broker.
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Ordering safeguards on the producer side. Without these, a retry of a
      # failed batch can be written AFTER a later batch that succeeded, which
      # reorders records inside a partition before a consumer ever sees them.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    listener:
      # One thread per listener. Concurrency belongs at the partition level,
      # not inside a single consumer.
      concurrency: 1

logging:
  level:
    root: WARN
    com.codewithsam.ordering: INFO
    org.apache.kafka: ERROR
  pattern:
    console: "%d{HH:mm:ss.SSS} %-7.7t %msg%n"
