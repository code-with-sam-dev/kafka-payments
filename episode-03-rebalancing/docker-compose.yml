# Everything needed to see Kafka rebalancing break, in one command.
#
#   docker compose up --build
#
# Kafka runs in KRaft mode, so there is no ZooKeeper to explain or wait for.
# NO FIXED CONTAINER NAMES, deliberately.
#
# Both episodes used to pin `container_name: kafka`, so bringing up a second
# episode while another was running failed with a name conflict. Compose
# derives a unique name from the project directory when none is pinned, and the
# SERVICE name is what provides DNS inside the network, so nothing else
# changes. Two episodes can now run side by side, which is exactly what someone
# comparing them would want to do.
services:
  kafka:
    image: apache/kafka:3.8.0
    ports:
      # Episode 1 uses 29092, so this one takes 29093 and they coexist.
      - "29093:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Six partitions across two consumer threads, so a revocation actually
      # hands work to the other member rather than leaving it unowned.
      KAFKA_NUM_PARTITIONS: 6
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20

  demo:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
