name: Bug report
description: Something does not work when you run it
labels: [bug]
body:
  - type: dropdown
    id: stage
    attributes:
      label: Which stage
      options:
        - episode-01-ordering
        - more than one stage
        - not sure
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command you ran and the output. Paste text rather than a screenshot where you can, so it is searchable.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: docker
    attributes:
      label: Docker version
      description: Output of `docker --version`
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and chip
      placeholder: macOS 15 on Apple silicon, Ubuntu 24.04 on x86_64, Windows 11 with WSL2
    validations:
      required: true
