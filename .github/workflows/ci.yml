# Every episode stage is built and tested independently, so a change to a later
# stage can never silently break an earlier one — which matters because each
# stage is what a viewer clones after watching that specific episode.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage:
          - episode-01-ordering
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: mvn -B test
        working-directory: ${{ matrix.stage }}
